name: Offline source checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the instrument-compatible Python 3.9 profile
        if: matrix.python == '3.9'
        run: python -m pip install -r requirements-student-py39.txt pytest==8.3.5 pytest-subtests==0.14.1
      - name: Install development dependencies
        if: matrix.python != '3.9'
        run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q .
      - run: node --check tools/analysis_workbench/static/app.js
      - run: node --check tools/analysis_workbench/static/workflow.js
      - run: node --check tools/stitch_setup/static/app.js
